<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 760 448" width="760" height="448" role="img" aria-label="Lab network topology: home LAN, two dual-homed hosts, isolated vmbr1">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f1e1d; }
    .b { font-weight: 600; }
    .s { font-size: 11.5px; fill: #6b6a66; }
    .s.ink { fill: #1f1e1d; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    .box { fill: none; stroke: #b4b1a9; stroke-width: 1.25; }
    .box.main { fill: #2c84db; fill-opacity: 0.12; stroke: #2c84db; stroke-width: 2; }
    .box.planned { stroke-dasharray: 4 4; }
    .link { fill: none; stroke: #b4b1a9; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      text, .s.ink { fill: #ecebe8; }
      .s { fill: #a5a4a0; }
      .box, .link { stroke: #5f5e5a; }
      .box.main { fill: #5ea6ee; stroke: #5ea6ee; }
    }
  </style>

  <!-- links -->
  <path class="link" d="M250 148V180"/>
  <path class="link" d="M250 236V318"/>
  <path class="link" d="M600 148V180"/>
  <path class="link" d="M490 236V318"/>

  <!-- home LAN -->
  <rect class="box" x="24" y="52" width="712" height="96" rx="8"/>
  <text class="b" x="40" y="74">Home LAN · vmbr0</text>
  <rect class="box" x="40" y="88" width="320" height="44" rx="8"/>
  <text class="m" x="200" y="114">Router · .1</text>
  <rect class="box" x="400" y="88" width="320" height="44" rx="8"/>
  <text class="m" x="560" y="114">Proxmox host · .100</text>

  <!-- dual-homed hosts -->
  <rect class="box" x="40" y="180" width="240" height="56" rx="8"/>
  <text class="b" x="56" y="203">ParrotOS</text>
  <text class="s" x="56" y="222">home LAN NIC + ens19 at .5</text>

  <rect class="box main" x="480" y="180" width="240" height="56" rx="8"/>
  <text class="b" x="496" y="203">goad-control</text>
  <text class="s ink" x="496" y="222">eth0 .205 · eth1 .20</text>

  <text class="s e" x="588" y="168">NAT egress only when switched on</text>

  <!-- vmbr1 -->
  <rect class="box" x="24" y="280" width="712" height="172" rx="8"/>
  <text class="b" x="40" y="302">vmbr1 · no physical port</text>

  <rect class="box" x="40" y="318" width="460" height="118" rx="8"/>
  <text class="b" x="56" y="340">VLAN 66 · GOAD-LAB · 172.16.66.0/24</text>

  <rect class="box" x="56" y="356" width="132" height="64" rx="8"/>
  <text class="b m" x="122" y="382">DC01</text>
  <text class="s m" x="122" y="402">172.16.66.10</text>

  <rect class="box" x="200" y="356" width="132" height="64" rx="8"/>
  <text class="b m" x="266" y="382">DC02</text>
  <text class="s m" x="266" y="402">172.16.66.11</text>

  <rect class="box" x="344" y="356" width="132" height="64" rx="8"/>
  <text class="b m" x="410" y="382">SRV02</text>
  <text class="s m" x="410" y="402">172.16.66.22</text>

  <rect class="box planned" x="516" y="318" width="204" height="118" rx="8"/>
  <text class="b" x="532" y="340">VLAN 67 · MONITORING</text>
  <text class="s" x="532" y="362">172.16.67.0/24</text>
  <text class="s" x="532" y="380">Wazuh / Suricata (planned)</text>
</svg>
